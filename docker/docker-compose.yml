version: '3'
services:
  mysql57:
    image: mysql:5.7
    container_name: litemall-mysql
    ports:
      - "3306:3306"
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/data:/var/lib/mysql
      - ./db/init-sql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: litemall123456
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plitemall123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  litemall:
    build:
      context: ..
      dockerfile: docker/litemall/Dockerfile
    container_name: litemall-app
    ports:
      - "8080:8080"
    volumes:
      - ./litemall/storage:/storage
      - ./litemall/logs:/logs
      - ./litemall/backup:/backup
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      mysql57:
        condition: service_healthy
    restart: always
